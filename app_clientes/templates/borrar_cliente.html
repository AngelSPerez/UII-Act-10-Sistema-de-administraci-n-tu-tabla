<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Borrado</title>
    <link rel="stylesheet" href="https://bootswatch.com/5/slate/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://i.imgur.com/Uw6oVVt_d.webp?maxwidth=760&fidelity=grand" alt="" width="35px"> Abarrotes "El Angelito"</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor02" aria-controls="navbarColor02" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor02">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'agregar_cliente' %}">Agregar Cliente</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'inicio' %}">Ver Clientes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card border-danger">
                    <div class="card-header text-center">
                        <h2>Confirmar Borrado</h2>
                    </div>
                    <div class="card-body">
                        <p class="text-center">¿Estás seguro de que quieres borrar al cliente?</p>
                        <h4 class="text-center text-warning">{{ cliente.nombre }} {{ cliente.apellidos }}</h4>
                        <form method="post" class="mt-4">
                            {% csrf_token %}
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-danger">Sí, Borrar Cliente</button>
                                <a href="{% url 'inicio' %}" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
